<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Attendance">
<link rel="manifest" href="manifest.json">
<title>Winwill Attendance</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#174ea6;color:white;padding:16px;text-align:center}
header h1{margin:0;font-size:20px}header p{margin:5px 0 0;font-size:13px}
nav{display:flex;background:white;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}
nav button{flex:1;border:0;background:white;padding:12px 4px;font-weight:bold;color:#42526b}
nav button.active{color:#174ea6;border-bottom:3px solid #174ea6}
main{max-width:1100px;margin:auto;padding:12px}
.page{display:none}.page.active{display:block}
.card{background:white;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #00000010}
.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:130px}
label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px;color:#526078}
input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white;font-size:15px}
button.action{border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:white;font-weight:bold}
button.secondary{background:#64748b}.danger{background:#dc2626!important}
.table-wrap{overflow:auto}.att{width:100%;border-collapse:collapse;min-width:700px}
.att th,.att td{border:1px solid #d8dee9;padding:7px;text-align:center;font-size:13px}
.att th{background:#e8eef8}.att tr.saturday{background:#dceeff}.att tr.sunday{background:#ffe1e1}.att tr.poya{background:#fff2a8}
.att input{padding:6px;min-width:85px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8eef8;font-size:12px}
.money{font-size:18px;font-weight:bold}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.summary .box{background:#fff;border-radius:10px;padding:14px;border-left:4px solid #2563eb}
.small{font-size:12px;color:#64748b}.center{text-align:center}
@media print{nav,.no-print,header{display:none!important}.page{display:none!important}.page.active{display:block!important}body{background:white}.card{box-shadow:none}}
</style>
</head>
<body>
<header>
<h1>Winwill Co. (pvt) Ltd</h1><p>Biyagama — Attendance & Salary Calculator</p>
</header>
<nav>
<button id="navAttendance" class="active" onclick="showPage('attendance')">Attendance</button>
<button id="navPay" onclick="showPage('pay')">Pay Sheet</button>
<button id="navSettings" onclick="showPage('settings')">Settings</button>
</nav>
<main>

<section id="attendance" class="page active">
<div class="card no-print">
<div class="row">
<div class="field"><label>Employee Name</label><input id="topName" readonly></div>
<div class="field"><label>Phone</label><input id="topPhone" readonly></div>
<div class="field"><label>Month</label><select id="month"></select></div>
<div class="field"><label>Year</label><select id="year"></select></div>
</div>
</div>
<div class="card">
<div class="row no-print" style="margin-bottom:10px">
<button class="action" onclick="saveMonth()">Save Attendance</button>
<button class="action secondary" onclick="printPage()">Print / PDF</button>
</div>
<div class="table-wrap">
<table class="att"><thead><tr><th>Date</th><th>Day</th><th>In</th><th>Out</th><th>Total Hours</th><th>OT Hours</th></tr></thead>
<tbody id="attendanceBody"></tbody></table>
</div></div>
</section>

<section id="pay" class="page">
<div class="card">
<h2>Estimated Pay Sheet</h2>
<p class="small">This is an estimate based on the attendance entered above.</p>
<div class="summary" id="paySummary"></div>
</div>
<div class="card">
<h3>Calculation</h3>
<div id="payDetails"></div>
</div>
<div class="card no-print"><button class="action" onclick="printPage()">Print / PDF</button></div>
</section>

<section id="settings" class="page">
<div class="card">
<h2>Settings</h2>
<div class="row">
<div class="field"><label>Employee Name</label><input id="setName"></div>
<div class="field"><label>Phone</label><input id="setPhone"></div>
</div><br>
<div class="row">
<div class="field"><label>Shift / Basic Rate per Working Day (Rs.)</label><input id="shiftRate" type="number"></div>
<div class="field"><label>OT Rate per Hour (Rs.)</label><input id="otRate" type="number"></div>
<div class="field"><label>Attendance Allowance (Rs.)</label><input id="allowance" type="number"></div>
</div><br>
<div class="row">
<div class="field"><label>Deduction (%)</label><input id="deduction" type="number" step="0.01"></div>
<div class="field"><label>මරණාධාර Deduction (Rs.)</label><input id="funeral" type="number"></div>
</div><br>
<button class="action" onclick="saveSettings()">Save Settings</button>
</div>
</section>
</main>

<script>
const KEY_SETTINGS="winwill_settings_v1";
const DEFAULT_SETTINGS={name:"Eroshan Ekanayaka",phone:"071 5500451",shiftRate:1800,otRate:337,attendanceAllowance:8000,deductionPercent:8,funeralDeduction:400};
const poya={
2026:["2026-01-03","2026-02-01","2026-03-02","2026-04-01","2026-05-01","2026-05-30","2026-06-29","2026-07-29","2026-08-27","2026-09-26","2026-10-25","2026-11-24","2026-12-23"],
2027:["2027-01-22","2027-02-20","2027-03-22","2027-04-20","2027-05-19","2027-06-18","2027-07-18","2027-08-16","2027-09-15","2027-10-15","2027-11-13","2027-12-13"],
2028:["2028-01-12","2028-02-25","2028-03-25","2028-04-24","2028-05-23","2028-06-22","2028-07-21","2028-08-20","2028-09-18","2028-10-18","2028-11-16","2028-12-15"]
};
let settings=JSON.parse(localStorage.getItem(KEY_SETTINGS)||"null")||DEFAULT_SETTINGS;
const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
month.innerHTML=months.map((m,i)=>`<option value="${i}">${m}</option>`).join("");
year.innerHTML=[2026,2027,2028].map(y=>`<option>${y}</option>`).join("");
month.value=new Date().getMonth(); year.value=new Date().getFullYear();
function settingsToUI(){topName.value=settings.name;topPhone.value=settings.phone;setName.value=settings.name;setPhone.value=settings.phone;shiftRate.value=settings.shiftRate;otRate.value=settings.otRate;allowance.value=settings.attendanceAllowance;deduction.value=settings.deductionPercent;funeral.value=settings.funeralDeduction}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function dateKey(y,m,d){return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
function calc(inT,outT){if(!inT||!outT)return {h:"",ot:""};let a=inT.split(":").map(Number),b=outT.split(":").map(Number);let x=a[0]+a[1]/60,y=b[0]+b[1]/60;if(y<x)y+=24;let h=Math.round((y-x)*100)/100;return {h,ot:Math.round(Math.max(0,h-8)*100)/100}}
function getData(){return JSON.parse(localStorage.getItem(`attendance_${year.value}_${Number(month.value)+1}`)||"{}")}
function saveMonth(){let data={};document.querySelectorAll("#attendanceBody tr").forEach(tr=>{let d=tr.dataset.date;let ins=tr.querySelector(".in").value,outs=tr.querySelector(".out").value;if(ins||outs)data[d]={in:ins,out:outs}});localStorage.setItem(`attendance_${year.value}_${Number(month.value)+1}`,JSON.stringify(data));render();alert("Attendance saved.");}
function render(){let y=Number(year.value),m=Number(month.value),data=getData(),html="";for(let d=1;d<=daysInMonth(y,m);d++){let dt=new Date(y,m,d),key=dateKey(y,m,d),day=dt.toLocaleDateString("en-US",{weekday:"short"}),cls=poya[y]?.includes(key)?"poya":dt.getDay()===6?"saturday":dt.getDay()===0?"sunday":"";let r=data[key]||{};let c=calc(r.in,r.out);html+=`<tr class="${cls}" data-date="${key}"><td>${d}</td><td>${day}</td><td><input class="in" type="time" value="${r.in||""}" oninput="updateRow(this)"></td><td><input class="out" type="time" value="${r.out||""}" oninput="updateRow(this)"></td><td class="hours">${c.h===""?"":c.h.toFixed(2)}</td><td class="ot">${c.ot===""?"":c.ot.toFixed(2)}</td></tr>`}attendanceBody.innerHTML=html;updatePay()}
function updateRow(el){let tr=el.closest("tr"),c=calc(tr.querySelector(".in").value,tr.querySelector(".out").value);tr.querySelector(".hours").textContent=c.h===""?"":c.h.toFixed(2);tr.querySelector(".ot").textContent=c.ot===""?"":c.ot.toFixed(2);updatePay()}
function updatePay(){let records=[...document.querySelectorAll("#attendanceBody tr")].map(tr=>({in:tr.querySelector(".in").value,out:tr.querySelector(".out").value})).filter(x=>x.in&&x.out);let totalOT=records.reduce((s,x)=>s+calc(x.in,x.out).ot,0),workingDays=records.length,basic=workingDays*Number(settings.shiftRate),otAmount=totalOT*Number(settings.otRate),allow=Number(settings.attendanceAllowance),gross=basic+otAmount+allow,ded=basic*Number(settings.deductionPercent)/100,fun=Number(settings.funeralDeduction),take=gross-ded-fun;paySummary.innerHTML=[["Working Days",workingDays],["Basic",money(basic)],["OT",money(otAmount)],["Allowance",money(allow)],["Gross",money(gross)],["Total Deductions",money(ded+fun)],["Take Home",money(take)]].map(x=>`<div class="box"><div class="small">${x[0]}</div><div class="money">${x[1]}</div></div>`).join("");payDetails.innerHTML=`<p>Basic = ${workingDays} × Rs. ${Number(settings.shiftRate).toFixed(2)} = <b>${money(basic)}</b></p><p>OT = ${totalOT.toFixed(2)} hours × Rs. ${Number(settings.otRate).toFixed(2)} = <b>${money(otAmount)}</b></p><p>Gross = Basic + OT + Allowance = <b>${money(gross)}</b></p><p>Deduction = ${Number(settings.deductionPercent)}% of Basic = <b>${money(ded)}</b></p><p>මරණාධාර = <b>${money(fun)}</b></p><p><b>Estimated Take Home = ${money(take)}</b></p>`}
function money(n){return "Rs. "+Number(n).toLocaleString("en-LK",{minimumFractionDigits:2,maximumFractionDigits:2})}
function saveSettings(){settings={name:setName.value.trim(),phone:setPhone.value.trim(),shiftRate:Number(shiftRate.value)||0,otRate:Number(otRate.value)||0,attendanceAllowance:Number(allowance.value)||0,deductionPercent:Number(deduction.value)||0,funeralDeduction:Number(funeral.value)||0};localStorage.setItem(KEY_SETTINGS,JSON.stringify(settings));settingsToUI();updatePay();alert("Settings saved.")}
function showPage(p){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(p).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.getElementById("nav"+p[0].toUpperCase()+p.slice(1)).classList.add("active");if(p==="pay")updatePay()}
function printPage(){window.print()}
month.onchange=render;year.onchange=render;settingsToUI();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(console.error))}
</script>
</body>
</html>
